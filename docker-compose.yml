name: ruang
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruang}
      POSTGRES_USER: ${POSTGRES_USER:-ruang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random POSTGRES_PASSWORD in root .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    env_file: apps/api/.env
    environment:
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-ruang}
      DB_USERNAME: ${POSTGRES_USER:-ruang}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      SESSION_DRIVER: database
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-null}
      REVERB_APP_ID: ruang-local
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Run setup:env}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Run setup:env}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_CLIENT_HOST: localhost
      REVERB_CLIENT_PORT: 8080
      REVERB_CLIENT_SCHEME: http
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,localhost:8000
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SCHEME: null
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
    ports: ['127.0.0.1:8000:8000']
    volumes: [api-storage:/app/storage]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: infrastructure/docker/web.Dockerfile}
    environment: {API_ORIGIN: 'http://api:8000'}
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ['127.0.0.1:8025:8025']
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z}
    profiles: [storage]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruang}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
  meilisearch:
    image: getmeili/meilisearch:v1.15
    profiles: [search]
    environment: {MEILI_MASTER_KEY: '${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}'}
    volumes: [search-data:/meili_data]
    ports: ['127.0.0.1:7700:7700']
  worker:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    profiles: [workers]
    env_file: apps/api/.env
    command: [php, artisan, queue:work, --tries=3, --timeout=60, --max-time=3600]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_CONNECTION: pgsql
      DB_DATABASE: ${POSTGRES_DB:-ruang}
      DB_USERNAME: ${POSTGRES_USER:-ruang}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-null}
      REVERB_APP_ID: ruang-local
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Run setup:env}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Run setup:env}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    restart: unless-stopped
    stop_grace_period: 70s
    depends_on: [api]
    volumes: [api-storage:/app/storage]
  reverb:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    profiles: [realtime]
    env_file: apps/api/.env
    environment:
      REVERB_APP_ID: ruang-local
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Run setup:env}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Run setup:env}
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      FRONTEND_URL: http://localhost:3000
    command: [php, artisan, reverb:start, --host=0.0.0.0, --port=8080]
    ports: ['127.0.0.1:8080:8080']
    restart: unless-stopped
    depends_on: [api]
volumes:
  postgres-data:
  redis-data:
  api-storage:
  minio-data:
  search-data:
