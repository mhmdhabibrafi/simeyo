openapi: 3.1.0
info:
  title: Simeyo API
  version: 0.3.0
  description: Implemented identity, social, campus and native push-device
    endpoints. Session cookie name follows the configured APP_NAME unless
    SESSION_COOKIE overrides it. First-party cookie writes require CSRF; native
    clients use scoped bearer tokens. All private reads enforce institutional
    approval, blocks, audience and ancestry visibility.
servers:
  - url: http://localhost:8000/api/v1
security:
  - SessionCookie: []
  - NativeBearer: []
paths:
  /health:
    get:
      description: Database health check
      security: []
      responses:
        "200":
          description: Database health check
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /auth/options:
    get:
      description: Public registration/delivery availability, exact allowed email
        domains and optional public Firebase web configuration. Typed email
        alone never grants verification.
      security: []
      responses:
        "200":
          description: Public registration/delivery availability, exact allowed email
            domains and optional public Firebase web configuration. Typed email
            alone never grants verification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: object
                    properties:
                      firebase:
                        anyOf:
                          - type: object
                            properties:
                              apiKey:
                                type: string
                              authDomain:
                                type: string
                              projectId:
                                type: string
                              appId:
                                type: string
                            required:
                              - apiKey
                              - authDomain
                              - projectId
                              - appId
                            additionalProperties: false
                          - type: "null"
                      registration_enabled:
                        type: boolean
                      email_delivery_enabled:
                        type: boolean
                      email_domains:
                        type: array
                        items:
                          type: string
                    required:
                      - registration_enabled
                      - email_delivery_enabled
                      - email_domains
                    additionalProperties: false
                required:
                  - data
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /auth/register:
    post:
      description: Web registration; CSRF required. Privilege fields ignored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "201":
          description: Web registration; CSRF required. Privilege fields ignored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
        "503":
          description: Registration is closed by operator
  /auth/login:
    post:
      description: Web cookie login; CSRF required
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Web cookie login; CSRF required
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /auth/firebase:
    post:
      description: Firebase Google ID token exchange; CSRF required. Verified exact
        campus domains receive approved membership without administrator rights.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firebase_token:
                  type: string
                  maxLength: 16384
              required:
                - firebase_token
      responses:
        "200":
          description: Firebase Google ID token exchange; CSRF required. Verified exact
            campus domains receive approved membership without administrator
            rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /me/password:
    put:
      description: Change own password using current credentials. Web session rotates
        and remains active; all other web sessions, native tokens and pending
        reset links are revoked. Native caller must log in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  maxLength: 1024
                password:
                  type: string
                  minLength: 12
                  maxLength: 1024
                password_confirmation:
                  type: string
              required:
                - current_password
                - password
                - password_confirmation
      responses:
        "204":
          description: Change own password using current credentials. Web session rotates
            and remains active; all other web sessions, native tokens and
            pending reset links are revoked. Native caller must log in again.
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /auth/logout:
    post:
      description: Invalidate current web session
      responses:
        "204":
          description: Invalidate current web session
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /auth/forgot-password:
    post:
      description: Uniform recovery message regardless of account presence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: Uniform recovery message regardless of account presence
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
        "503":
          description: Email delivery is unavailable
  /auth/reset-password:
    post:
      description: Reset password and revoke sessions/tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                password_confirmation:
                  type: string
              required:
                - email
                - token
                - password
                - password_confirmation
      responses:
        "200":
          description: Reset password and revoke sessions/tokens
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /auth/email/resend:
    post:
      description: Resend email verification
      responses:
        "200":
          description: Resend email verification
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
        "503":
          description: Email delivery is unavailable
  /auth/email/verify/{id}/{hash}:
    get:
      description: Logged-in owner and temporary signed URL required; redirect to onboarding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Logged-in owner and temporary signed URL required; redirect to
            onboarding
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /auth/native/login:
    post:
      description: Issue campus-scoped token expiring after 30 days
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device_name:
                  type: string
                  maxLength: 80
              required:
                - email
                - password
                - device_name
      responses:
        "200":
          description: Issue campus-scoped token expiring after 30 days
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
                    required:
                      - user
                      - token
                required:
                  - data
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /auth/native/logout:
    post:
      description: Revoke current native bearer token
      responses:
        "204":
          description: Revoke current native bearer token
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /me:
    get:
      description: Current user with owner fields
      responses:
        "200":
          description: Current user with owner fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
    patch:
      description: Update profile and visibility preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Update profile and visibility preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /institutions:
    get:
      description: Catalog of institutions, faculties, departments, and cohorts
      security: []
      responses:
        "200":
          description: Catalog of institutions, faculties, departments, and cohorts
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /onboarding:
    post:
      description: Email-verified user sets institution; affiliation locked after submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                institution_id:
                  type: integer
                faculty_id:
                  type:
                    - integer
                    - "null"
                department_id:
                  type:
                    - integer
                    - "null"
                academic_cohort_id:
                  type:
                    - integer
                    - "null"
              required:
                - institution_id
      responses:
        "200":
          description: Email-verified user sets institution; affiliation locked after
            submission
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /verification:
    get:
      description: Own verification request or null
      responses:
        "200":
          description: Own verification request or null
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
    post:
      description: Request manual affiliation review or configured student-email approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requested_affiliation:
                  type: string
                  enum:
                    - student
                    - lecturer
                    - alumni
                    - organization_manager
                method:
                  type: string
                  enum:
                    - manual
                    - institutional_email
                statement:
                  type: string
                  minLength: 20
                  maxLength: 1000
              required:
                - requested_affiliation
                - method
                - statement
      responses:
        "201":
          description: Request manual affiliation review or configured student-email
            approval
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /profiles/{username}:
    get:
      description: Same-institution approved profile; academic fields obey visibility
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Same-institution approved profile; academic fields obey visibility
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /campus:
    get:
      description: Approved membership context; not a social feed
      responses:
        "200":
          description: Approved membership context; not a social feed
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /me/media:
    post:
      description: "Upload profile image: JPEG/PNG/WebP, server transport limits, max
        4096px; reencoded metadata-free JPEG"
      responses:
        "200":
          description: "Upload profile image: JPEG/PNG/WebP, server transport limits, max
            4096px; reencoded metadata-free JPEG"
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - avatar
                    - cover
                image:
                  type: string
                  format: binary
              required:
                - kind
                - image
  /auth/sessions:
    get:
      description: Own web sessions, no serialized payload or IP
      responses:
        "200":
          description: Own web sessions, no serialized payload or IP
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /auth/sessions/{id}:
    delete:
      description: Revoke own session, foreign sessions unaffected
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoke own session, foreign sessions unaffected
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /admin/verifications:
    get:
      description: Institution-scoped administrator queue; super administrator can
        access all
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Institution-scoped administrator queue; super administrator can
            access all
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /admin/verifications/{id}:
    patch:
      description: Audited review; no self-review; pending to approved/rejected,
        approved to suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                    - approved
                    - rejected
                    - suspended
                review_note:
                  type: string
                  minLength: 10
                  maxLength: 1000
              required:
                - state
                - review_note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audited review; no self-review; pending to approved/rejected,
            approved to suspended
        "401":
          description: Authentication required
        "403":
          description: Permission or verification requirement not met
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                  - message
                  - errors
        "429":
          description: Rate limited
  /posts:
    post:
      description: Create a persisted campus/community post, reply or quote. Optional
        client_id makes same-content retries idempotent; conflicting or deleted
        drafts return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type:
                    - string
                    - "null"
                  maxLength: 1000
                visibility:
                  type: string
                  enum:
                    - campus
                    - followers
                parent_id:
                  type:
                    - integer
                    - "null"
                quote_id:
                  type:
                    - integer
                    - "null"
                community_id:
                  type:
                    - integer
                    - "null"
                client_id:
                  type:
                    - string
                    - "null"
                  format: uuid
                media_ids:
                  type: array
                  uniqueItems: true
                  items:
                    type: integer
              required:
                - body
                - visibility
      responses:
        "201":
          description: Create a persisted campus/community post, reply or quote. Optional
            client_id makes same-content retries idempotent; conflicting or
            deleted drafts return 409.
          content:
            application/json:
              schema:
                type: object
                properties:
