name: iOS simulator build
on:
  workflow_dispatch:
    inputs:
      simulator_run_id:
        description: 'Optional existing simulator artifact run ID for repeating launch acceptance without recompiling'
        required: false
        type: string
permissions: {contents: read, actions: read}
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_PUBLIC_WEB_URL: http://localhost:3000
      SIMULATOR_RUN_ID: ${{ inputs.simulator_run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: xcodebuild -version
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm run lint && npm test
        working-directory: apps/mobile
      - run: npx expo prebuild --platform ios --no-clean --no-install
        if: inputs.simulator_run_id == ''
        working-directory: apps/mobile
      - run: pod install
        if: inputs.simulator_run_id == ''
        working-directory: apps/mobile/ios
      - name: Compile simulator app without distribution signing
        if: inputs.simulator_run_id == ''
        run: xcodebuild -workspace Simeyo.xcworkspace -scheme Simeyo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../../.local/ios-ci/build CODE_SIGNING_ALLOWED=NO -quiet
        working-directory: apps/mobile/ios
      - name: Reuse an explicitly selected simulator artifact
        if: inputs.simulator_run_id != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          case "$SIMULATOR_RUN_ID" in *[!0-9]*|'') echo 'Invalid simulator run ID.' >&2; exit 1;; esac
          mkdir -p .local/ios-ci
          gh run view "$SIMULATOR_RUN_ID" --json headSha,url > .local/ios-ci/simulator-source.json
          gh run download "$SIMULATOR_RUN_ID" -n simeyo-ios-simulator -D .local/ios-ci
          chmod +x .local/ios-ci/build/Build/Products/Debug-iphonesimulator/Simeyo.app/Simeyo
      - name: Install pinned native UI test tool
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-cli"
          cd "$RUNNER_TEMP/maestro-cli"
          gh release download cli-2.11.0 --repo mobile-dev-inc/Maestro -p maestro.zip -p checksums_sha256.txt
          checksum=$(awk '$2 == "maestro.zip" || $2 == "*maestro.zip" { print $1 }' checksums_sha256.txt)
          test -n "$checksum"
          printf '%s  maestro.zip\n' "$checksum" | shasum -a 256 -c -
          unzip -q maestro.zip
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Launch the installed simulator app and capture its initial screen
        run: |
          set -eu
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          open -a Simulator
          xcrun simctl install "$device" .local/ios-ci/build/Build/Products/Debug-iphonesimulator/Simeyo.app
          (cd apps/mobile && npx expo start --lan --port 8081) >.local/ios-ci/metro.log 2>&1 &
          metro_pid=$!
          trap 'xcrun simctl io "$device" screenshot .local/ios-ci/initial-screen.png >/dev/null 2>&1 || true; kill "$metro_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8081/status | grep -q packager-status:running; then ready=true; break; fi
            sleep 2
          done
          [ "$ready" = true ]
          xcrun simctl launch "$device" app.simeyo.mobile
          xcrun simctl openurl "$device" 'exp+simeyo://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
          maestro --device "$device" test apps/mobile/.maestro/ios-launch.yaml
          xcrun simctl io "$device" screenshot .local/ios-ci/initial-screen.png
          xcrun simctl spawn "$device" launchctl list | grep app.simeyo.mobile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simeyo-ios-simulator
          path: |
            .local/ios-ci/build/Build/Products/Debug-iphonesimulator/Simeyo.app
            .local/ios-ci/initial-screen.png
            .local/ios-ci/simulator-source.json
          if-no-files-found: warn
          retention-days: 3
