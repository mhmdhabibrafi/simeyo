name: Simeyo checks
on: [push, pull_request]
permissions: {contents: read}
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_DB: ruang_test, POSTGRES_USER: ruang_test, POSTGRES_PASSWORD: ci-isolated-test-password}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      APP_ENV: testing
      APP_KEY: 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ruang_test
      DB_USERNAME: ruang_test
      DB_PASSWORD: ci-isolated-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_pgsql, gd, mbstring, zip', coverage: none}
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/api
      - run: php vendor/bin/pint --test
        working-directory: apps/api
      - run: php vendor/phpunit/phpunit/phpunit
        working-directory: apps/api
      - name: Verify isolated PostgreSQL backup and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RECOVERY_MEDIA_DIRECTORY: ${{ runner.temp }}/simeyo-recovery
        run: |
          php infrastructure/scripts/test-application-recovery.php prepare
          docker cp infrastructure/scripts "$POSTGRES_CONTAINER:/tmp/simeyo-scripts"
          docker exec -e CI=true -e PGDATABASE=ruang_test -e PGUSER=ruang_test -e PGPASSWORD="$DB_PASSWORD" "$POSTGRES_CONTAINER" sh /tmp/simeyo-scripts/test-database-recovery.sh
          DB_DATABASE=simeyo_restore_application_ci php infrastructure/scripts/test-application-recovery.php verify
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm run test:unit && npm run build
        working-directory: apps/web
      - run: node infrastructure/scripts/validate-config.mjs
      - run: npm run test:contracts
      - run: node --test infrastructure/tests/benchmark.test.mjs
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/mobile/package-lock.json}
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run lint && npm run typecheck && npm test
        working-directory: apps/mobile
  production-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: sh infrastructure/scripts/test-production-stack.sh
        # Synthetic ambient values must not override the disposable fixture environment.
        env:
          SIMEYO_PRODUCTION_ENV_FILE: /nonexistent/ambient-environment
          DB_HOST: ignored.invalid
          DB_DATABASE: must_never_be_used
          DB_PASSWORD: synthetic-ambient-not-a-secret
          APP_KEY: synthetic-invalid-key-must-be-ignored
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-stack-evidence
          path: |
            .local/production-ci/api-sample.json
            .local/production-ci/query-plan.json
            .local/production-ci/sustained-load.json
            .local/production-ci/resources.jsonl
          if-no-files-found: warn
          retention-days: 3
