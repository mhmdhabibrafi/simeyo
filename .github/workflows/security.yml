name: Release image audit
on: workflow_dispatch
permissions: {contents: read}
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build fresh release images without publishing
        run: |
          docker build --pull -f infrastructure/docker/api.production.Dockerfile -t simeyo-api:scan .
          docker build --pull -f infrastructure/docker/web.production.Dockerfile -t simeyo-web:scan .
          docker pull nginx:stable-alpine
          docker pull postgres:17
          docker pull aquasec/trivy:latest
      - name: Scan OS and application packages
        run: |
          mkdir -p .local/image-audit
          directory=$(cd .local/image-audit && pwd)
          docker image inspect aquasec/trivy:latest --format '{{.Id}}' > "$directory/scanner-image-id.txt"
          for pair in api=simeyo-api:scan web=simeyo-web:scan gateway=nginx:stable-alpine postgres=postgres:17; do
            name=${pair%%=*}
            image=${pair#*=}
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$directory:/reports" -v trivy-ci-cache:/root/.cache/ aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL --format json --output "/reports/$name.json" "$image"
          done
      - name: Enforce release vulnerability gate
        run: node infrastructure/scripts/check-image-audit.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-image-audit
          path: .local/image-audit/
          if-no-files-found: error
          retention-days: 3
