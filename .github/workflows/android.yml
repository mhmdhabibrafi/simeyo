name: Android development APK
on: workflow_dispatch
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
      EXPO_PUBLIC_WEB_URL: http://10.0.2.2:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm run lint && npm test
        working-directory: apps/mobile
      - run: npx expo prebuild --platform android --no-clean --no-install
        working-directory: apps/mobile
      - name: Compile development client for ARM64 and emulator
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: simeyo-android-development
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
