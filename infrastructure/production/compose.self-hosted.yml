# Optional dedicated PostgreSQL for a NEW self-hosted installation only.
# Never substitute this service or volume under an existing database.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Supply a dedicated database name}
      # Bootstrap only: create DB_USERNAME as a separate non-superuser before migration.
      POSTGRES_USER: simeyo_database_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Supply a persistent database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
  api:
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
